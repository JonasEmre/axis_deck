<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>AxisDeck</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="topbar-spacer" aria-hidden="true"></div>
        <div class="topbar-actions">
          <div class="status" id="connectionStatus">Connecting</div>
          <button class="topbar-button" type="button" data-button="start">Start</button>
          <div class="settings-menu">
            <button class="topbar-button" type="button" id="settingsToggle" aria-expanded="false">Settings</button>
            <div class="settings-panel" id="settingsPanel" hidden>
              <label class="settings-field">
                <span>Steering Return</span>
                <select id="steeringReturnMode" aria-label="Steering return mode">
                  <option value="standard" selected>Standard</option>
                  <option value="fast">Fast</option>
                  <option value="custom">Custom</option>
                </select>
              </label>
              <label class="settings-field">
                <span>Custom Return</span>
                <input id="steeringReturnCustom" type="range" min="1.2" max="4.2" step="0.1" value="1.6" disabled />
              </label>
              <label class="settings-field">
                <span>Gearbox Position</span>
                <select id="gearboxPosition" aria-label="Gearbox position">
                  <option value="right" selected>Right</option>
                  <option value="left">Left</option>
                </select>
              </label>
            </div>
          </div>
          <select class="mode-select" id="controlMode" aria-label="Control mode">
            <option value="joystick">Joystick</option>
            <option value="steering" selected>Steering</option>
          </select>
        </div>
      </header>

      <section class="controls gearbox-right" id="controlDeck" aria-label="Control deck">
        <article class="panel joystick-panel primary-panel">
          <h2 class="sr-only" id="primaryControlTitle">Steering</h2>
          <output class="sr-only" id="joystickReadout">X 0.00 / Y 0.00</output>
          <div class="signal-controls" aria-label="Turn signals">
            <button class="signal-button" type="button" data-button="leftSignal" aria-pressed="false" aria-label="Left signal">&larr;</button>
            <button class="signal-button" type="button" data-button="rightSignal" aria-pressed="false" aria-label="Right signal">&rarr;</button>
          </div>
          <canvas id="joystickCanvas" width="420" height="420" aria-label="Joystick control"></canvas>
        </article>

        <article class="panel shifter-panel">
          <div class="shifter" id="shifter" aria-label="Five speed and reverse shifter">
            <div class="shift-gate" aria-hidden="true"></div>
            <button class="gear-slot" type="button" data-gear="gear1" style="--col: 1; --row: 1">1</button>
            <button class="gear-slot" type="button" data-gear="gear2" style="--col: 1; --row: 3">2</button>
            <button class="gear-slot" type="button" data-gear="gear3" style="--col: 2; --row: 1">3</button>
            <button class="gear-slot" type="button" data-gear="gear4" style="--col: 2; --row: 3">4</button>
            <button class="gear-slot" type="button" data-gear="gear5" style="--col: 3; --row: 1">5</button>
            <button class="gear-slot" type="button" data-gear="reverse" style="--col: 3; --row: 3">R</button>
            <div class="gear-knob" id="gearKnob" aria-hidden="true">N</div>
          </div>
          <output class="sr-only" id="buttonReadout">Ready</output>
          <div class="button-grid">
            <button class="control-button icon-button" type="button" data-button="handbrake" aria-label="Handbrake">🅿️</button>
            <button class="control-button icon-button" type="button" data-button="hazards" aria-label="Hazards">⚠️</button>
            <button class="control-button icon-button" type="button" data-button="lights" aria-label="Lights">💡</button>
            <button class="control-button icon-button" type="button" data-button="horn" aria-label="Horn">📯</button>
          </div>
        </article>

        <article class="panel pedals-panel">
          <output class="sr-only" id="pedalsReadout">C 0.00 / B 0.00 / T 0.00</output>
          <div class="pedals">
            <div class="spring-axis" data-axis="clutch" role="slider" aria-label="Clutch" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="axis-label">Clutch</div>
              <div class="spring-axis-fill clutch-fill"></div>
              <div class="spring-axis-thumb"></div>
            </div>
            <div class="spring-axis" data-axis="brake" role="slider" aria-label="Brake" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="axis-label">Brake</div>
              <div class="spring-axis-fill brake-fill"></div>
              <div class="spring-axis-thumb"></div>
            </div>
            <div class="spring-axis" data-axis="throttle" role="slider" aria-label="Throttle" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="axis-label">Throttle</div>
              <div class="spring-axis-fill"></div>
              <div class="spring-axis-thumb"></div>
            </div>
          </div>
        </article>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
