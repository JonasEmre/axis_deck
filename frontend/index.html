<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AxisDeck</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">CCP 2.0</p>
          <h1>AxisDeck</h1>
        </div>
        <div class="status" id="connectionStatus">Connecting</div>
      </header>

      <section class="controls" aria-label="Control deck">
        <article class="panel joystick-panel">
          <div class="panel-header">
            <h2>Joystick</h2>
            <output id="joystickReadout">X 0.00 / Y 0.00</output>
          </div>
          <canvas id="joystickCanvas" width="420" height="420" aria-label="Joystick control"></canvas>
        </article>

        <article class="panel pedals-panel">
          <div class="panel-header">
            <h2>Pedals</h2>
            <output id="pedalsReadout">T 0.00 / B 0.00</output>
          </div>
          <div class="pedals">
            <div class="spring-axis" data-axis="throttle" role="slider" aria-label="Throttle" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="axis-label">Throttle</div>
              <div class="spring-axis-fill"></div>
              <div class="spring-axis-thumb"></div>
            </div>
            <div class="spring-axis" data-axis="brake" role="slider" aria-label="Brake" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="axis-label">Brake</div>
              <div class="spring-axis-fill brake-fill"></div>
              <div class="spring-axis-thumb"></div>
            </div>
          </div>
        </article>

        <article class="panel buttons-panel">
          <div class="panel-header">
            <h2>Buttons</h2>
            <output id="buttonReadout">Ready</output>
          </div>
          <div class="button-grid">
            <button class="control-button" type="button" data-button="fire">Fire</button>
            <button class="control-button" type="button" data-button="gear">Gear</button>
            <button class="control-button" type="button" data-button="boost">Boost</button>
            <button class="control-button" type="button" data-button="mode">Mode</button>
          </div>
        </article>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
