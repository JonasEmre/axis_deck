<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>AxisDeck</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div id="appRoot"></div>

    <template id="moduleChooserTemplate">
      <main class="shell module-shell">
        <section class="module-picker" aria-label="AxisDeck modules">
          <div class="module-picker-header">
            <p class="module-kicker">AxisDeck</p>
            <h1>Modules</h1>
          </div>
          <div class="module-grid">
            <button class="module-card ready" type="button" data-module="steering">
              <span class="module-card-title">Steering</span>
              <span class="module-card-meta">Ready</span>
            </button>
            <button class="module-card upcoming" type="button" data-module="ksp">
              <span class="module-card-title">Kerbal Space Program</span>
              <span class="module-card-meta">Telemetry coming soon</span>
            </button>
          </div>
        </section>
      </main>
    </template>

    <template id="kspTemplate">
      <main class="shell ksp-shell">
        <header class="ksp-topbar">
          <button class="topbar-button" type="button" data-action="show-modules">Modules</button>
          <div class="ksp-status-row" aria-label="KSP status">
            <div class="status" id="kspConnectionStatus">Connecting</div>
            <div class="ksp-vessel-name" id="kspVesselName">AxisDeck Demo Vessel</div>
          </div>
        </header>

        <section class="ksp-flight-deck" aria-label="Kerbal Space Program control panel">
          <section class="ksp-action-strip" aria-label="Flight toggles">
            <button class="ksp-toggle" type="button" data-button="lights" aria-pressed="false">Lights</button>
            <button class="ksp-toggle" type="button" data-button="gear" aria-pressed="false">Gear</button>
            <button class="ksp-toggle ksp-toggle-danger" type="button" data-button="stage" aria-pressed="false">Stage</button>
          </section>

          <section class="ksp-readouts" aria-label="Flight readouts">
            <div class="ksp-readout">
              <span>Speed:</span>
              <strong id="kspSpeedText">0.0 m/s</strong>
            </div>
            <div class="ksp-readout">
              <span>Alt:</span>
              <strong id="kspAltitudeText">0 m</strong>
            </div>
            <div class="ksp-readout">
              <span>AP:</span>
              <strong id="kspApoapsisText">--:--</strong>
            </div>
            <div class="ksp-readout">
              <span>PE:</span>
              <strong id="kspPeriapsisText">--:--</strong>
            </div>
          </section>

          <section class="ksp-gauge-grid" aria-label="Telemetry gauges">
            <div class="ksp-gauge" data-gauge="solidFuel">
              <canvas width="260" height="150" aria-label="Solid fuel gauge"></canvas>
              <span>Solid Fuel</span>
            </div>
            <div class="ksp-gauge" data-gauge="liquidFuel">
              <canvas width="260" height="150" aria-label="Liquid fuel gauge"></canvas>
              <span>Liquid Fuel</span>
            </div>
            <div class="ksp-gauge" data-gauge="oxidizer">
              <canvas width="260" height="150" aria-label="Oxidizer gauge"></canvas>
              <span>Oxidizer</span>
            </div>
            <div class="ksp-gauge" data-gauge="monoPropellant">
              <canvas width="260" height="150" aria-label="Monopropellant gauge"></canvas>
              <span>MonoProp</span>
            </div>
            <div class="ksp-gauge" data-gauge="electricCharge">
              <canvas width="260" height="150" aria-label="Battery gauge"></canvas>
              <span>Battery</span>
            </div>
            <div class="ksp-gauge" data-gauge="intakeAir">
              <canvas width="260" height="150" aria-label="Intake air gauge"></canvas>
              <span>Intake Air</span>
            </div>
            <div class="ksp-gauge" data-gauge="gForce">
              <canvas width="260" height="150" aria-label="G force gauge"></canvas>
              <span>G Force</span>
            </div>
            <div class="ksp-gauge" data-gauge="verticalSpeed">
              <canvas width="260" height="150" aria-label="Vertical speed gauge"></canvas>
              <span>VSI</span>
            </div>
          </section>

          <section class="ksp-control-zone" aria-label="Flight controls">
            <article class="ksp-stick-panel ksp-stick-panel-with-throttle">
              <div class="ksp-stick-main">
                <label for="kspRollSlider">Roll</label>
                <input id="kspRollSlider" class="ksp-horizontal-range ksp-fat-range ksp-range-bipolar ksp-range-bipolar-horizontal" type="range" min="-100" max="100" value="0" />
                <canvas id="kspPitchYawPad" width="320" height="320" aria-label="Pitch and yaw joystick"></canvas>
                <span>Pitch / Yaw</span>
              </div>
              <div class="ksp-slider-panel ksp-slider-panel-vertical">
                <label for="kspThrottleSlider">Throttle</label>
                <input id="kspThrottleSlider" class="ksp-vertical-range ksp-fat-range ksp-range-throttle" type="range" min="0" max="100" value="0" />
                <output id="kspThrottleOutput">0%</output>
              </div>
            </article>
            <article class="ksp-center-switches" aria-label="Flight assist toggles">
              <button class="ksp-toggle" type="button" data-button="rcs" aria-pressed="false">RCS</button>
              <button class="ksp-toggle" type="button" data-button="sas" aria-pressed="false">SAS</button>
            </article>
            <article class="ksp-stick-panel ksp-stick-panel-with-translate">
              <div class="ksp-slider-panel ksp-slider-panel-vertical">
                <label for="kspTranslateForwardSlider">FWD/BCK</label>
                <input id="kspTranslateForwardSlider" class="ksp-vertical-range ksp-fat-range ksp-range-bipolar ksp-range-bipolar-vertical" type="range" min="-100" max="100" value="0" />
                <output id="kspTranslateForwardOutput">0%</output>
              </div>
              <div class="ksp-stick-main">
                <canvas id="kspTranslatePad" width="320" height="320" aria-label="Translate joystick"></canvas>
                <span>Translate</span>
              </div>
            </article>
          </section>
        </section>
      </main>
    </template>

    <template id="steeringTemplate">
<main class="shell">
      <header class="topbar">
        <div class="topbar-leading"><button class="topbar-button" type="button" data-action="show-modules">Modules</button></div>
        <div class="topbar-actions">
          <div class="status" id="connectionStatus">Connecting</div>
          <button class="topbar-button" type="button" data-button="start">Start</button>
          <div class="settings-menu">
            <button class="topbar-button" type="button" id="settingsToggle" aria-expanded="false">Settings</button>
            <div class="settings-panel" id="settingsPanel" hidden>
              <label class="settings-field">
                <span>Steering Return</span>
                <select id="steeringReturnMode" aria-label="Steering return mode">
                  <option value="standard" selected>Standard</option>
                  <option value="fast">Fast</option>
                  <option value="custom">Custom</option>
                </select>
              </label>
              <label class="settings-field">
                <span>Custom Return</span>
                <input id="steeringReturnCustom" type="range" min="1.2" max="4.2" step="0.1" value="1.6" disabled />
              </label>
              <label class="settings-field">
                <span>Steering Feel</span>
                <select id="steeringFeel" aria-label="Steering feel">
                  <option value="direct" selected>Direct</option>
                  <option value="smooth">Smooth</option>
                  <option value="heavy">Heavy</option>
                </select>
              </label>
              <label class="settings-field">
                <span>Game</span>
                <select id="gameProfile" aria-label="Game profile">
                  <option value="motor-town" selected>Motor Town</option>
                  <option value="beamng">BeamNG.drive</option>
                </select>
              </label>
              <label class="settings-field">
                <span>Gearbox Output</span>
                <select id="gearboxOutputMode" aria-label="Gearbox output mode">
                  <option value="hold" selected>Hold</option>
                  <option value="pulse">Pulse</option>
                </select>
              </label>
              <label class="settings-field">
                <span>Gearbox Position</span>
                <select id="gearboxPosition" aria-label="Gearbox position">
                  <option value="right" selected>Right</option>
                  <option value="left">Left</option>
                </select>
              </label>
              <label class="settings-field">
                <span>Gearbox Type</span>
                <select id="gearboxType" aria-label="Gearbox type">
                  <option value="5-speed" selected>5 Speed</option>
                  <option value="6-speed">6 Speed</option>
                  <option value="truck-realistic">Truck H Range/Splitter</option>
                  <option value="truck-direct">Truck Direct</option>
                </select>
              </label>
            </div>
          </div>
        </div>
      </header>

      <section class="controls gearbox-right" id="controlDeck" aria-label="Control deck">
        <article class="panel joystick-panel primary-panel">
          <h2 class="sr-only" id="primaryControlTitle">Steering</h2>
          <output class="sr-only" id="joystickReadout">X 0.00 / Y 0.00</output>
          <canvas id="joystickCanvas" width="420" height="420" aria-label="Joystick control"></canvas>
          <div class="wheel-controls" aria-label="Steering wheel controls">
            <button class="control-button icon-button wheel-button" type="button" data-button="leftSignal" aria-label="Left signal">&larr;</button>
            <button class="control-button icon-button wheel-button horn-button" type="button" data-button="horn" aria-label="Horn">📯</button>
            <button class="control-button icon-button wheel-button" type="button" data-button="rightSignal" aria-label="Right signal">&rarr;</button>
          </div>
        </article>

        <article class="panel shifter-panel">
          <div class="shifter" id="shifter" aria-label="Five speed and reverse shifter">
            <div class="shift-gate" aria-hidden="true"></div>
            <div class="gear-knob" id="gearKnob" aria-hidden="true">N</div>
          </div>
          <output class="sr-only" id="buttonReadout">Ready</output>
          <div class="truck-toggles" id="truckToggles" hidden>
            <div class="truck-toggle-group" aria-label="Truck range">
              <button class="truck-toggle" type="button" id="truckRangeToggle" aria-pressed="false">Range</button>
            </div>
            <div class="truck-toggle-group" aria-label="Truck splitter">
              <button class="truck-toggle" type="button" id="truckSplitterToggle" aria-pressed="false">Splitter L</button>
            </div>
          </div>
          <div class="reverse-toggle-wrap" id="reverseToggleWrap" hidden>
            <button class="reverse-toggle" type="button" id="reverseToggle" aria-pressed="false">R</button>
          </div>
          <div class="button-grid">
            <button class="control-button icon-button" type="button" data-button="handbrake" aria-label="Handbrake">🅿️</button>
            <button class="control-button icon-button" type="button" data-button="hazards" aria-label="Hazards">⚠️</button>
            <button class="control-button icon-button" type="button" data-button="lights" aria-label="Lights">💡</button>
          </div>
        </article>

        <article class="panel pedals-panel">
          <output class="sr-only" id="pedalsReadout">C 0.00 / B 0.00 / T 0.00</output>
          <div class="pedals">
            <div class="spring-axis" data-axis="clutch" role="slider" aria-label="Clutch" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="axis-label">Clutch</div>
              <div class="spring-axis-fill clutch-fill"></div>
              <div class="spring-axis-thumb"></div>
            </div>
            <div class="spring-axis" data-axis="brake" role="slider" aria-label="Brake" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="axis-label">Brake</div>
              <div class="spring-axis-fill brake-fill"></div>
              <div class="spring-axis-thumb"></div>
            </div>
            <div class="spring-axis" data-axis="throttle" role="slider" aria-label="Throttle" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="axis-label">Throttle</div>
              <div class="spring-axis-fill"></div>
              <div class="spring-axis-thumb"></div>
            </div>
          </div>
        </article>
      </section>
    </main>
    </template>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
